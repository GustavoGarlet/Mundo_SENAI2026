<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">

    <title>Contador de Entradas</title>

    <!-- CSS será colocado depois -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <header>
            <h1>Contador de Entradas</h1>

            <p>
                Sistema de contagem de pessoas
            </p>
        </header>


        <main>

            <section class="contador">

                <h2>Total de pessoas que entraram</h2>

                <div id="numero">
                    0
                </div>

                <span>pessoas</span>

            </section>


            <section class="status">

                <div class="indicador"></div>

                <p id="status">
                    Aguardando o Arduino...
                </p>

            </section>


            <section class="informacoes">

                <h3>Funcionamento</h3>

                <p>
                    Cada vez que o botão conectado ao Arduino
                    for pressionado, uma nova entrada será
                    registrada no sistema.
                </p>

            </section>


            <button id="zerar">
                Zerar contador
            </button>

        </main>

    </div>


    <!-- JavaScript será colocado depois -->
    <script src="script.js"></script>

</body>
</html>
